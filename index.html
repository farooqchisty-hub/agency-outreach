<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agency Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#14201b;--mute:#66736d;--line:#e3e7e4;--accent:#0b996e;--accent-soft:#e3f4ed;--warn:#c2410c;--warn-soft:#fdeee4;--blue:#2563eb;--blue-soft:#e8efff;--grey-soft:#eef0ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1412;--card:#171e1b;--ink:#e8eeeb;--mute:#93a29b;--line:#26302c;--accent:#34c38f;--accent-soft:#16332a;--warn:#fb923c;--warn-soft:#3a2416;--blue:#7aa2ff;--blue-soft:#1b2540;--grey-soft:#212a26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--grey-soft);color:var(--mute)}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--mute);font-size:12px;font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .d{color:var(--mute);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px;border-top:0}
.scroll{overflow-x:auto}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar{height:12px;background:var(--grey-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.feed{max-height:360px;overflow:auto}
.feed div{padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.feed div:first-child{border-top:0}
.feed time{color:var(--mute);font-size:12px;margin-right:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.slot.used{background:var(--accent-soft);border-color:transparent}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters button{font:inherit;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filters button.act{background:var(--ink);color:var(--card);border-color:var(--ink)}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:180px}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.gate{max-width:420px;margin:80px auto;text-align:center}
.small{font-size:12px;color:var(--mute)}
.nbtn{font:inherit;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.nbtn.has{border-color:var(--accent);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:10}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;padding:18px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 2px;font-size:17px}
.modal label{display:block;font-size:12px;color:var(--mute);font-weight:500;margin:12px 0 4px}
.modal select,.modal input,.modal textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.modal textarea{min-height:150px;resize:vertical}
.modal .ctx{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mute);margin-top:8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
.actions .save{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.actions .cancel{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer}
.v-Shortlist{background:var(--accent-soft);color:var(--accent)} .v-Maybe{background:var(--blue-soft);color:var(--blue)} .v-Not{background:var(--warn-soft);color:var(--warn)}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 7px;border-radius:7px;font-weight:700;font-size:12px;background:var(--grey-soft);color:var(--mute)}
.score.hi{background:var(--accent-soft);color:var(--accent)} .score.mid{background:var(--blue-soft);color:var(--blue)}
.bk{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:150px 1fr;gap:12px}
.bk:first-of-type{border-top:0;padding-top:2px}
@media (max-width:640px){.bk{grid-template-columns:1fr}}
.bk .when{font-weight:600}
.bk .name{font-weight:700;font-size:15px}
.bk .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.bk .txt{font-size:13px;margin-top:6px}
.bk .lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.bk ul{margin:4px 0 0 16px;padding:0;font-size:13px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;align-items:center}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="gate"><h1>Agency Outreach</h1><p class="sub">Loading…</p></div></div>
<script>
const API = 'https://agency-outreach.winningstatics.workers.dev/dash.json';
let key = new URLSearchParams(location.hash.slice(1)).get('k');
try { if (key) localStorage.setItem('ao_k', key); else key = localStorage.getItem('ao_k'); } catch (e) {}
if (location.hash) history.replaceState(null, '', location.pathname);
let data = null, filter = 'all', q = '', editing = null, sortBy = 'rank', sortDir = 1;
const sc = (n, why) => n == null ? '<span class="score">?</span>' : `<span class="score ${n >= 60 ? 'hi' : n >= 40 ? 'mid' : ''}" title="${esc(why || '')}">${n}</span>`;
const hl = (l) => { try { return JSON.parse(l.highlights || '[]'); } catch (e) { return []; } };
const host = (u) => String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
const NOTE_API = 'https://agency-outreach.winningstatics.workers.dev/dash/note';
const vpill = (v) => v ? `<span class="pill v-${esc(v.split(' ')[0])}">${esc(v)}</span>` : '';
const nbtn = (l) => `<button class="nbtn ${l.takeaways || l.verdict || l.next_step ? 'has' : ''}" data-note="${l.id}">${l.takeaways || l.verdict || l.next_step ? 'Notes' : '+ Notes'}</button>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const istFmt = (iso) => iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const slotFmt = (k) => { if (!k) return ''; const [d, t] = k.split(' '); const [h, m] = t.split(':').map(Number); return new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) + ', ' + (((h + 11) % 12) + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm'); };
const STATUS = { queued: ['Not contacted', ''], contacted: ['Contacted', 'blue'], engaged: ['In conversation', 'blue'], booked: ['Call booked', 'on'], escalated: ['Needs you', 'warn'], unresponsive: ['No response', ''], declined: ['Declined', ''], opted_out: ['Opted out', ''], bounced: ['Bounced', 'warn'], excluded: ['No email', ''] };
const pill = (s) => { const [t, c] = STATUS[s] || [s, '']; return `<span class="pill ${c}">${esc(t)}</span>`; };
const short = (a) => String(a || '').replace(/\s*\(.*\)\s*/, ' ').replace(/\b(pvt\.?|private|ltd\.?|limited|llp)\b/gi, '').trim();

async function load() {
  if (!key) { document.getElementById('app').innerHTML = '<div class="gate"><h1>Agency Outreach</h1><p class="sub">Open this page with your private link (it ends in #k=…).</p></div>'; return; }
  try {
    const r = await fetch(API + '?key=' + encodeURIComponent(key), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 403 ? 'That link key is not valid.' : 'Agent returned ' + r.status);
    data = await r.json(); if (!editing) render();
  } catch (e) { document.getElementById('app').innerHTML = `<div class="gate"><h1>Agency Outreach</h1><p class="sub">${esc(e.message)}</p></div>`; }
}

function render() {
  const L = data.leads, by = (s) => L.filter((l) => l.status === s);
  const sendable = L.filter((l) => l.status !== 'excluded');
  const contacted = L.filter((l) => l.opened_at);
  const replied = L.filter((l) => l.replies_in > 0);
  const booked = by('booked');
  const nowKey = (() => { const x = new Date(Date.now() + 330 * 60000).toISOString(); return x.slice(0, 10) + ' ' + x.slice(11, 16); })();
  const upcoming = booked.filter((l) => l.call_at && l.call_at >= nowKey).sort((a, b) => a.call_at.localeCompare(b.call_at));
  const pastCalls = booked.filter((l) => l.call_at && l.call_at < nowKey);
  const needs = by('escalated');
  const noted = L.filter((l) => l.verdict || l.takeaways || l.next_step || l.meet_notes_url || (l.call_at && l.call_at < nowKey));
  const mn = (l) => l.meet_notes_url ? `<div><a href="${esc(l.meet_notes_url)}" target="_blank" rel="noopener">Meeting notes (Gemini)</a></div>` : (l.meet_notes_text ? '<div class="small">Gemini summary in Notes</div>' : (l.call_at && l.call_at < nowKey ? '<div class="small">Gemini notes: not found yet</div>' : ''));
  const out = (k) => data.msgs.filter((m) => m.dir === 'out' && m.kind === k).reduce((a, m) => a + m.n, 0);
  const sentToday = data.slots.filter((s) => s.used && s.kind !== 'idle').length;
  const rate = contacted.length ? Math.round((replied.length / contacted.length) * 100) : 0;
  const next = upcoming[0];

  const funnel = [['Not contacted', by('queued').length], ['Contacted', contacted.length], ['Replied', replied.length], ['Call booked', booked.length]];
  const fmax = Math.max(1, sendable.length);
  const side = [['No response', by('unresponsive').length], ['Declined', by('declined').length], ['Bounced', by('bounced').length], ['Opted out', by('opted_out').length]];

  const rows = L.filter((l) => (filter === 'all' || l.status === filter) && (!q || (l.agency + ' ' + (l.contact_name || '') + ' ' + (l.city || '') + ' ' + (l.agency_brief || '')).toLowerCase().includes(q))).sort((a, b) => ((a[sortBy] ?? -1) - (b[sortBy] ?? -1)) * sortDir);
  const counts = {}; L.forEach((l) => (counts[l.status] = (counts[l.status] || 0) + 1));
  const chips = ['all', 'booked', 'escalated', 'engaged', 'contacted', 'queued', 'unresponsive', 'declined', 'bounced', 'excluded'].filter((s) => s === 'all' || counts[s]);

  document.getElementById('app').innerHTML = `
  <header>
    <div><h1>Agency Outreach</h1><div class="sub">India agencies for Shopify + TikTok ads · Brevo / PushOwl</div></div>
    <div class="sub">${data.config.sending_enabled === '1' ? '<span class="pill on">Sending on</span>' : '<span class="pill warn">Sending paused</span>'} · ${esc(data.config.daily_cap)}/weekday · calls ${esc(data.config.call_hours)} IST · updated ${istFmt(data.now)}</div>
  </header>
  <div class="kpis">
    <div class="kpi"><div class="l">Contacted</div><div class="v">${contacted.length}<span class="sub"> / ${sendable.length}</span></div><div class="d">${sentToday} sent today</div></div>
    <div class="kpi"><div class="l">Replied</div><div class="v">${replied.length}</div><div class="d">${rate}% reply rate</div></div>
    <div class="kpi"><div class="l">Calls booked</div><div class="v">${booked.length}</div><div class="d">${upcoming.length} upcoming</div></div>
    <div class="kpi"><div class="l">Next call</div><div class="v" style="font-size:17px;margin-top:6px">${next ? esc(short(next.agency)) : 'None yet'}</div><div class="d">${next ? slotFmt(next.call_at) + ' IST' : ''}</div></div>
    <div class="kpi"><div class="l">Needs you</div><div class="v" style="color:${needs.length ? 'var(--warn)' : 'inherit'}">${needs.length}</div><div class="d">${needs.length ? 'see below' : 'nothing waiting'}</div></div>
  </div>
  <div class="grid">
    <div>
      <div class="card"><h2><span>Booked calls</span><span class="small">${upcoming.length} upcoming</span></h2>${upcoming.length ? upcoming.map((l) => `<div class="bk">
        <div><div class="when">${slotFmt(l.call_at)}</div><div class="small">IST · 30 min</div><div class="links">${l.meet_link ? `<a href="${esc(l.meet_link)}" target="_blank" rel="noopener">Join Meet</a>` : '<span class="small">invite pending</span>'}</div></div>
        <div><div class="name">${esc(short(l.agency))}</div>
          <div class="meta"><a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(host(l.website))}</a><span class="small">${esc((l.city || '').split(/[,(;]/)[0])}</span> <span class="small">Relevance</span>${sc(l.relevance_score, l.relevance_why)} <span class="small">Quality</span>${sc(l.quality_score, l.quality_why)} ${vpill(l.verdict)}</div>
          ${l.agency_brief ? `<div class="txt">${esc(l.agency_brief)}</div>` : ''}
          ${hl(l).length ? `<ul>${hl(l).map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
          ${l.conv_summary ? `<div class="lbl">Conversation so far</div><div class="txt">${esc(l.conv_summary)}</div>` : ''}
          <div class="links"><span class="small">With ${esc(l.contact_name || l.email)}</span>${l.thread_url ? `<a href="${esc(l.thread_url)}" target="_blank" rel="noopener">Gmail thread</a>` : ''}${nbtn(l)}</div>
        </div></div>`).join('') : '<div class="empty">No calls booked yet.</div>'}
      ${pastCalls.length ? `<div class="small" style="margin-top:8px">Past calls: ${pastCalls.map((l) => esc(short(l.agency)) + ' (' + slotFmt(l.call_at) + ')').join(', ')}</div>` : ''}</div>
      <div class="card"><h2>Call notes and takeaways</h2>${noted.length ? `<table>${noted.map((l) => `<tr><td style="width:34%"><b>${esc(short(l.agency))}</b><div class="small">${l.call_at ? slotFmt(l.call_at) : ''}</div>${vpill(l.verdict)}${mn(l)}</td><td><div class="clip">${esc(l.takeaways || '')}</div>${l.next_step ? `<div class="small">Next: ${esc(l.next_step)}</div>` : ''}${!l.takeaways && !l.next_step ? '<span class="small">No notes yet</span>' : ''}</td><td style="text-align:right">${nbtn(l)}</td></tr>`).join('')}</table>` : '<div class="empty">Add notes from any agency row. Calls you have had show up here automatically.</div>'}</div>
      <div class="card"><h2>Needs you</h2>${needs.length ? `<table>${needs.map((l) => `<tr><td><b>${esc(short(l.agency))}</b><div class="small">${esc(l.escalation || '')}</div></td><td style="text-align:right">${l.thread_url ? `<a href="${esc(l.thread_url)}" target="_blank" rel="noopener">Open thread</a>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">Nothing waiting on you.</div>'}</div>
      <div class="card"><h2>In conversation</h2>${by('engaged').length ? `<table>${by('engaged').map((l) => `<tr><td><b>${esc(short(l.agency))}</b> ${sc(l.relevance_score, l.relevance_why)} ${sc(l.quality_score, l.quality_why)}<div class="small">${esc(l.conv_summary || l.last_summary || '')}</div></td><td class="small" style="white-space:nowrap">${istFmt(l.last_in_at)}</td><td>${l.thread_url ? `<a href="${esc(l.thread_url)}" target="_blank" rel="noopener">Gmail</a>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">No open conversations.</div>'}</div>
    </div>
    <div>
      <div class="card"><h2>Pipeline</h2><div class="funnel">${funnel.map(([t, n]) => `<div class="frow"><span>${t}</span><div class="bar"><i style="width:${(n / fmax) * 100}%"></i></div><b>${n}</b></div>`).join('')}</div>
        <div class="small" style="margin-top:10px">${side.map(([t, n]) => `${t}: ${n}`).join(' · ')}</div>
        <div class="small" style="margin-top:4px">Sent so far: ${out('opener')} openers, ${out('followup') + out('breakup')} follow-ups, ${out('nudge')} nudges, ${out('reply')} replies</div></div>
      <div class="card"><h2>Today's send plan</h2>${data.slots.length ? `<div class="slots">${data.slots.map((s) => `<span class="slot ${s.used ? 'used' : ''}" title="${esc(s.agency || '')}">${istFmt(s.at).split(', ').pop()}${s.used && s.agency ? ' · ' + esc(short(s.agency)) : ''}</span>`).join('')}</div>` : '<div class="empty">No sends today (weekend or holiday).</div>'}</div>
      <div class="card"><h2>Activity</h2><div class="feed">${data.events.map((e) => `<div><time>${istFmt(e.at.replace(' ', 'T') + 'Z')}</time>${e.agency ? '<b>' + esc(short(e.agency)) + '</b> · ' : ''}${esc(e.msg)}</div>`).join('')}</div></div>
    </div>
  </div>
  <div class="card"><h2><span>All agencies</span><input type="search" id="q" placeholder="Search agency, contact, city" value="${esc(q)}"></h2>
    <div class="filters">${chips.map((s) => `<button data-f="${s}" class="${filter === s ? 'act' : ''}">${s === 'all' ? 'All' : (STATUS[s] || [s])[0]} (${s === 'all' ? L.length : counts[s]})</button>`).join('')}</div>
    <div class="scroll"><table><tr><th class="sort" data-s="rank">#</th><th>Agency</th><th class="sort" data-s="relevance_score" title="Fit to our goal">Relevance ↕</th><th class="sort" data-s="quality_score" title="How credible the agency looks">Quality ↕</th><th>Contact</th><th>City</th><th>Status</th><th>Verdict</th><th>First email</th><th>Last reply</th><th>Call</th><th></th><th></th></tr>
    ${rows.map((l) => `<tr><td>${l.rank}</td><td><a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(short(l.agency))}</a><div class="small clip" style="max-width:280px">${esc(l.agency_brief || '')}</div></td><td>${sc(l.relevance_score, l.relevance_why)}</td><td>${sc(l.quality_score, l.quality_why)}</td><td>${esc(l.contact_name || '')}<div class="small">${esc(l.email || '')}</div></td><td class="small">${esc((l.city || '').split(/[,(;]/)[0])}</td><td>${pill(l.status)}</td><td>${vpill(l.verdict)}</td><td class="small">${istFmt(l.opened_at)}</td><td class="small">${istFmt(l.last_in_at)}</td><td class="small">${l.call_at ? slotFmt(l.call_at) : ''}</td><td>${l.thread_url ? `<a href="${esc(l.thread_url)}" target="_blank" rel="noopener">Gmail</a>` : ''}</td><td>${nbtn(l)}</td></tr>`).join('')}</table></div>
  </div>
  <div class="small">Relevance = fit to our goal (SaaS/app-install 30, TikTok outside India 25, Shopify merchants 20, US/UK/EU/AU clients 15, Reddit 10). Quality = credibility (proof 35, client calibre 20, team 20, partner badges 15, site and reviews 10). Scored from their site, our research and what they told us by email; hover a score for the reason. Refreshes every minute.</div>`;
  document.querySelectorAll('.filters button').forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));
  document.querySelectorAll('th.sort').forEach((th) => (th.onclick = () => { const k = th.dataset.s; if (sortBy === k) sortDir = -sortDir; else { sortBy = k; sortDir = k === 'rank' ? 1 : -1; } render(); }));
  document.querySelectorAll('[data-note]').forEach((b) => (b.onclick = () => openNote(Number(b.dataset.note))));
  const qi = document.getElementById('q'); qi.oninput = () => { q = qi.value.toLowerCase(); const pos = qi.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
}
function openNote(id) {
  const l = data.leads.find((x) => x.id === id); if (!l) return; editing = id;
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'ov';
  o.innerHTML = `<div class="modal" role="dialog" aria-label="Notes">
    <h3>${esc(short(l.agency))}</h3><div class="small">${esc(l.contact_name || '')} ${l.email ? '· ' + esc(l.email) : ''} ${l.call_at ? '· call ' + slotFmt(l.call_at) + ' IST' : ''}</div>
    <div class="meta" style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap"><a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(host(l.website))}</a> <span class="small">Relevance</span>${sc(l.relevance_score)} <span class="small">Quality</span>${sc(l.quality_score)}</div>
    ${l.agency_brief ? `<div class="ctx"><b>About</b><div>${esc(l.agency_brief)}</div>${hl(l).length ? `<ul style="margin:4px 0 0 16px;padding:0">${hl(l).map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}<div style="margin-top:6px"><b>Relevance:</b> ${esc(l.relevance_why || '')}</div><div><b>Quality:</b> ${esc(l.quality_why || '')}</div></div>` : ''}
    ${l.conv_summary ? `<div class="ctx"><b>Conversation so far</b><div>${esc(l.conv_summary)}</div></div>` : (l.last_summary ? `<div class="ctx">Agent's last read: ${esc(l.last_summary)}</div>` : '')}
    ${l.meet_notes_url || l.meet_notes_text ? `<div class="ctx"><b>Meeting notes (Gemini)</b>${l.meet_notes_url ? ` · <a href="${esc(l.meet_notes_url)}" target="_blank" rel="noopener">open doc</a>` : ''}${l.meet_notes_text ? `<div style="white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:6px">${esc(l.meet_notes_text)}</div>` : ''}</div>` : ''}
    <label for="nv">Verdict</label><select id="nv">${['', 'Shortlist', 'Maybe', 'Not a fit'].map((v) => `<option ${v === (l.verdict || '') ? 'selected' : ''} value="${v}">${v || 'Not decided'}</option>`).join('')}</select>
    <label for="nt">Takeaways, comments, feedback</label><textarea id="nt" placeholder="What did you learn on the call? Pricing, team, TikTok and Shopify proof, red flags, gut feel">${esc(l.takeaways || '')}</textarea>
    <label for="nn">Next step</label><input id="nn" placeholder="e.g. send brief, ask for proposal, intro to finance" value="${esc(l.next_step || '')}">
    <div class="actions"><span class="small" id="nmsg">${l.notes_updated_at ? 'Last saved ' + istFmt(l.notes_updated_at) : ''}</span><button class="cancel" id="nc">Cancel</button><button class="save" id="ns">Save</button></div></div>`;
  document.body.appendChild(o);
  const close = () => { o.remove(); editing = null; render(); };
  o.onclick = (e) => { if (e.target === o) close(); };
  document.getElementById('nc').onclick = close;
  document.getElementById('nt').focus();
  document.getElementById('ns').onclick = async () => {
    const body = { id, verdict: document.getElementById('nv').value, takeaways: document.getElementById('nt').value, next_step: document.getElementById('nn').value };
    const msg = document.getElementById('nmsg'); msg.textContent = 'Saving…';
    try {
      const r = await fetch(NOTE_API + '?key=' + encodeURIComponent(key), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('save failed (' + r.status + ')');
      const j = await r.json(); Object.assign(l, body, { notes_updated_at: j.at }); close();
    } catch (e) { msg.textContent = e.message; }
  };
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.getElementById('ov')) { document.getElementById('ov').remove(); editing = null; render(); } });
load(); setInterval(load, 60000);
</script>
</body>
</html>
